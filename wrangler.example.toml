# Copy to wrangler.toml ONLY after replacing the KV id (a wrangler.toml in the repo overrides dashboard bindings on Cloudflare Pages).
# Local dev without it:  wrangler pages dev public --kv STORE
# Cloudflare Pages config (used by `wrangler pages dev` locally; dashboard settings also work).
name = "scentranked"
pages_build_output_dir = "public"
compatibility_date = "2026-10-01"

[[kv_namespaces]]
binding = "STORE"
id = "REPLACE_WITH_KV_NAMESPACE_ID"   # wrangler kv namespace create scentranked-store

[vars]
SITE_URL = "https://scentranked.pages.dev"
GITHUB_REPO = "Refferalsites/scentranked"
GITHUB_BRANCH = "main"
ADMIN_USERNAME = "Admin"
