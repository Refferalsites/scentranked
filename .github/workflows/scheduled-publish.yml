name: Scheduled publish
on:
  schedule:
    - cron: "15 4 * * *"   # daily 04:15 UTC (09:15 PKT); posts dated before this go live
  workflow_dispatch:
jobs:
  trigger-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Cloudflare Pages deploy hook
        env:
          HOOK: ${{ secrets.CF_PAGES_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then echo "CF_PAGES_DEPLOY_HOOK secret not set"; exit 1; fi
          curl -fsS -X POST "$HOOK"
